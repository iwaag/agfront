schema = "ag.agent-config.v2"
project = "agfront"

[models."ollama/qwen3.8:27b-mlx-bf16"]

[models."anthropic/claude-sonnet-5"]

[models."google/gemini-2.5-flash"]

[models."antigravity/gemini-3.8-flash-medium"]

[models."antigravity/claude-sonnet-4-6"]

[models."openai/gpt-5.6-terra"]
effort = "medium"

[models."openai/gpt-5.4-mini"]
effort = "low"

[profiles.local]
harness = "agcode"
model = "ollama/qwen3.8:27b-mlx-bf16"

[profiles.sonnet]
harness = "claude_code"
model = "anthropic/claude-sonnet-5"

[profiles.stub]
harness = "fake"
model = "ollama/qwen3.8:27b-mlx-bf16"

# Google's Gemini CLI, headless. Selectable per project (autolab:
# `.local/projects/<p>/agents.toml`) or in the instance overlay; the CLI
# resolves its own key and reports tokens but no cost, so a gemini run's
# record carries `usage` only. `gemini-2.5-flash` is the model that answered
# on 2026-09-04 while the default model returned 503 all day.
[profiles.gemini]
harness = "gemini_cli"
model = "google/gemini-2.5-flash"

# Google's Antigravity CLI (`agy`), headless. The catalog is the Antigravity
# account's — Gemini and Claude alike — so the provider is `antigravity` and
# the record says which model ran (Agent ≠ Model). The CLI carries its own
# OAuth token; a run reports tokens, no cost. Two profiles so the model is a
# choice, not a rename.
[profiles.agy]
harness = "agy"
model = "antigravity/gemini-3.8-flash-medium"

[profiles.agy-claude]
harness = "agy"
model = "antigravity/claude-sonnet-4-6"

# OpenAI's Codex CLI (`codex exec`), headless, on the ChatGPT account the CLI
# is logged into: provider `openai`, the CLI owns its auth, a run reports
# tokens and no cost. The reasoning effort is the model's declared `effort`
# above. `codex-mini` is the cheap one, for `summarizer` trials.
[profiles.codex]
harness = "codex"
model = "openai/gpt-5.6-terra"

[profiles.codex-mini]
harness = "codex"
model = "openai/gpt-5.4-mini"

# Front routes; it does not do the work. The reading tools are for the
# chatlog and `tools/agents.md` in its own workspace, and `agentchat` is how
# it reaches the agent that does the work. This is the role's definition, not
# a fence: without a grant claude_code sits on an interactive permission
# prompt until the timeout (ag.agent-config.v2 makes the grant part of the role).
[roles.front]
profile = "sonnet"
requires = []
allowed_tools = "Read,Glob,Grep,Bash(agentchat:*)"

# The Front Desk (front_desk p1; `desk` since argue p2). The same reading
# tools and the same one route to other agents as `front`; what differs is
# the guide the listener pairs with it (`agent/guides/desk/guide.md`) and that
# its profile is its own, so the Front Desk can be moved to another harness or
# model without touching the ordinary entrance. It is given no character: the
# scene the screen plays is made afterwards by `present`.
[profiles.desk]
harness = "claude_code"
model = "anthropic/claude-sonnet-5"

[roles.desk]
profile = "desk"
requires = []
allowed_tools = "Read,Glob,Grep,Bash(agentchat:*)"

# The presentation role (argue p2): recorded speech in, character dialogue
# out (`agfront.present`). Its whole input is in its prompt and beside it as
# files; it has no `agentchat`, no shell and nothing to write with, so it can
# neither delegate nor speak in a discussion. Its own profile, so rendering
# can be moved to a cheaper model without touching any discussion role.
[profiles.present]
harness = "claude_code"
model = "anthropic/claude-sonnet-5"

[roles.present]
profile = "present"
requires = []
allowed_tools = "Read,Glob,Grep"

# A routine run (refine_routine p1). The same tools as `front`; the guide the
# listener pairs with it (`agent/guides/routine_run/guide.md`) is what makes
# it drive a `routinerun-` topic: read the guide and the record, delegate,
# judge the answers, record, and say when the run ends. Its own profile, so
# runs can be moved to another model without touching the entrance.
[profiles.routine_run]
harness = "claude_code"
model = "anthropic/claude-sonnet-5"

[roles.routine_run]
profile = "routine_run"
requires = []
# `agbudget` is the observation a run judges its conditions against
# (`agfront.budget`): a read of the plan windows, never a write.
allowed_tools = "Read,Glob,Grep,Bash(agentchat:*),Bash(agbudget:*)"

# The argue facilitator (argue p1). Front owns `#argue › argue-…` and is the
# one agent served there automatically; its reply carries no automatic
# hand-off mention, so an agent speaks in an argue only when Front names it
# on purpose. Same reading tools and the one route to other agents; its own
# profile so argues can be moved to another model without touching the rest.
[profiles.argue]
harness = "claude_code"
model = "anthropic/claude-sonnet-5"

[roles.argue]
profile = "argue"
requires = []
# `agproject` (agfront.project) is how an argue ends in something: a project
# or study channel with its document, and the workspace asked of autolab.
allowed_tools = "Read,Write,Glob,Grep,Bash(agentchat:*),Bash(agproject:*)"
