schema = "ag.agent-config.v2"
project = "agfront"

[models."ollama/qwen3.8:27b-mlx-bf16"]

[models."anthropic/claude-sonnet-5"]

[profiles.local]
harness = "agcode"
model = "ollama/qwen3.8:27b-mlx-bf16"

[profiles.sonnet]
harness = "claude_code"
model = "anthropic/claude-sonnet-5"

[profiles.stub]
harness = "fake"
model = "ollama/qwen3.8:27b-mlx-bf16"

# Front routes; it does not do the work. The reading tools are for the
# chatlog and `tools/agents.md` in its own workspace, and `agentchat` is how
# it reaches the agent that does the work. This is the role's definition, not
# a fence: without a grant claude_code sits on an interactive permission
# prompt until the timeout (ag.agent-config.v2 makes the grant part of the role).
[roles.front]
profile = "sonnet"
requires = []
allowed_tools = "Read,Glob,Grep,Bash(agentchat:*),Bash(rtschedule:*)"
